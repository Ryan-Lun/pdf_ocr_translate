<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}OCR Overlay Studio{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" data-local-href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" onerror="this.onerror=null;this.href=this.dataset.localHref;" />
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block global_nav %}
      {% include "_global_nav.html" %}
    {% endblock %}
    {% block content %}{% endblock %}
    <footer class="app-version" aria-label="系統版本">{{ app_version_label }}</footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
